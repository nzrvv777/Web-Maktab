<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ҷадвали дарсҳо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07070a; --orange:#ff6a1a; --orange-2:#ffab40;
    --text:#f2efe9; --muted:#8c8c94; --line:rgba(255,255,255,.09);
    --glass:rgba(255,255,255,.05); --glass-brd:rgba(255,255,255,.12);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100%; background:var(--bg-0); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
    overflow-x:hidden; position:relative; transition:background .4s ease;
  }
  body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(900px 500px at 82% -8%, rgba(255,106,26,.18), transparent 60%),
               radial-gradient(700px 500px at -10% 100%, rgba(255,106,26,.08), transparent 60%);
    transition:opacity .4s ease;}

  .ambient{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .ambient span{position:absolute; border-radius:50%; filter:blur(60px); opacity:.16; background:radial-gradient(circle,var(--orange),transparent 70%);}
  .ambient span:nth-child(1){width:280px; height:280px; top:-60px; right:-40px; animation:drift1 26s ease-in-out infinite;}
  .ambient span:nth-child(2){width:220px; height:220px; bottom:10%; left:-60px; animation:drift2 32s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0);} 50%{transform:translate(-30px,40px);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);} 50%{transform:translate(40px,-30px);}}

  /* rain layer, only active in professional theme */
  .rain{position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; opacity:0; transition:opacity .6s ease;}
  body.theme-pro .rain{opacity:1;}
  body.theme-pro::before{opacity:.05;}
  body.theme-pro{--bg-0:#05070a;}
  body.theme-mono{--bg-0:#000000; --orange:#e7e7e7; --orange-2:#ffffff;}
  body.theme-sunset{--bg-0:#180b10; --orange:#ff5f6d; --orange-2:#ffc371;}
  body.transparent-bg{background:transparent !important;}
  body.transparent-bg::before{opacity:0 !important;}
  body.transparent-bg .ambient{display:none;}
  body.transparent-bg .hero, body.transparent-bg .card, body.transparent-bg .profile-card,
  body.transparent-bg .theme-card, body.transparent-bg .toggle-row, body.transparent-bg .gear,
  body.transparent-bg .langs, body.transparent-bg .days button:not(.active),
  body.transparent-bg .form input, body.transparent-bg .form select, body.transparent-bg .btn-ghost{
    background:rgba(255,255,255,.06) !important; border-color:rgba(255,255,255,.16) !important;
    backdrop-filter:blur(26px) saturate(180%) !important; -webkit-backdrop-filter:blur(26px) saturate(180%) !important;
    box-shadow:none !important;
  }
  body.transparent-bg nav.tabbar{background:rgba(255,255,255,.05) !important; backdrop-filter:blur(26px) saturate(180%) !important; -webkit-backdrop-filter:blur(26px) saturate(180%) !important;}
  .drop{position:absolute; top:-10%; width:1px; background:linear-gradient(to bottom, transparent, rgba(190,215,255,.55)); animation:fall linear infinite;}
  @keyframes fall{to{transform:translateY(115vh);}}

  @media (prefers-reduced-motion: reduce){.ambient span{animation:none;} .drop{animation:none; display:none;}}

  .wrap{max-width:640px; margin:0 auto; padding:28px 18px 110px; position:relative; z-index:2;}

  header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; gap:10px;}
  .brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:-.02em;}
  .brand span{color:var(--orange);}
  .brand .sub{display:block; font-size:12px; color:var(--muted); font-weight:500; margin-top:2px;}
  .gear{width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--glass);
    backdrop-filter:blur(14px); color:var(--text); font-size:16px; cursor:pointer; flex-shrink:0;}
  .backbtn{border:none; background:none; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; padding:0; display:flex; align-items:center; gap:4px;}

  .days{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px; scrollbar-width:none;}
  .days::-webkit-scrollbar{display:none;}
  .days button{flex-shrink:0; border:1px solid var(--line); background:var(--glass); color:var(--text);
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:9px 14px; border-radius:12px; cursor:pointer;}
  .days button.active{background:linear-gradient(135deg,var(--orange),var(--orange-2)); color:#0a0a0a; border-color:transparent;}
  .days button.today-marker::after{content:"•"; color:var(--orange); margin-left:4px;}
  .days button.active.today-marker::after{color:#0a0a0a;}

  .hero{position:relative; border-radius:24px; padding:24px 22px;
    background:linear-gradient(155deg, rgba(255,106,26,.16), rgba(255,255,255,.04) 55%);
    border:1px solid var(--glass-brd); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow:0 30px 60px -30px rgba(255,106,26,.35), inset 0 1px 0 rgba(255,255,255,.08);
    transform-style:preserve-3d; transition:transform .25s ease, background .4s ease; margin-bottom:20px; overflow:hidden;}
  body.theme-pro .hero{background:rgba(255,255,255,.03); box-shadow:none;}
  .hero::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(220px 120px at var(--mx,50%) var(--my,0%), rgba(255,255,255,.14), transparent 60%);}
  .hero-label{font-size:12px; color:var(--orange-2); font-weight:600; display:flex; align-items:center; gap:7px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--orange); animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,106,26,.55);} 70%{box-shadow:0 0 0 10px rgba(255,106,26,0);} 100%{box-shadow:0 0 0 0 rgba(255,106,26,0);}}
  .hero-subject{font-family:'Space Grotesk',sans-serif; font-size:27px; font-weight:600; margin:9px 0 2px; letter-spacing:-.01em;}
  .hero-room{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .timer-row{display:flex; align-items:flex-end; justify-content:space-between; gap:14px;}
  .timer{font-family:'Space Grotesk',sans-serif; font-size:40px; font-weight:700; line-height:1; letter-spacing:-.02em;}
  .timer small{font-size:13px; color:var(--muted); font-weight:500; display:block; margin-bottom:5px;}
  .progress{flex:1; height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin-left:8px; align-self:center;}
  .progress-bar{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--orange),var(--orange-2)); width:0%; transition:width 1s linear;}

  .section-label{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin:22px 2px 10px;}
  .list{display:flex; flex-direction:column; gap:9px;}
  .card{position:relative; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 17px; border-radius:14px;
    background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition:transform .2s ease, border-color .2s ease, background .4s ease;}
  body.theme-pro .card{background:rgba(255,255,255,.02);}
  .card:hover{transform:translateY(-2px); border-color:var(--glass-brd);}
  .card.now{border-color:rgba(255,106,26,.5); background:rgba(255,106,26,.08); position:sticky; top:8px; z-index:3; box-shadow:0 10px 24px -10px rgba(0,0,0,.5);}
  .card.done{opacity:.4;}
  .lname{font-size:14px; font-weight:600; letter-spacing:-.005em; min-width:0;}
  .lname b{color:var(--orange-2); font-weight:700; margin-right:4px;}
  .ltime{font-size:12px; color:var(--muted); text-align:right; white-space:nowrap; flex-shrink:0; font-variant-numeric:tabular-nums;}
  .card.now .ltime{color:var(--orange-2); font-weight:600;}

  .placeholder-note{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px;}

  /* settings */
  .setting-block{margin-bottom:26px;}
  .setting-title{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}
  .langs{display:flex; gap:4px; background:var(--glass); border:1px solid var(--line); border-radius:11px; padding:3px; width:fit-content;}
  .langs button{border:none; background:transparent; color:var(--muted); font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:8px; cursor:pointer; font-family:'Inter',sans-serif;}
  .langs button.active{background:var(--orange); color:#0a0a0a;}
  .theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .theme-card{border:1px solid var(--line); background:var(--glass); border-radius:16px; padding:14px; cursor:pointer; text-align:left;}
  .theme-card.active{border-color:var(--orange); background:rgba(255,106,26,.08);}
  .theme-swatch{height:38px; border-radius:10px; margin-bottom:9px;}
  .theme-name{font-size:13px; font-weight:600;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:13px 15px; border-radius:14px;
    background:var(--glass); border:1px solid var(--line);}
  .switch{width:42px; height:24px; border-radius:99px; background:rgba(255,255,255,.12); position:relative; cursor:pointer; flex-shrink:0;}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s ease;}
  .switch.on{background:var(--orange);}
  .switch.on::after{transform:translateX(18px);}

  /* profile */
  .profile-card{border-radius:22px; padding:26px 22px; text-align:center;
    background:linear-gradient(155deg, rgba(255,106,26,.14), rgba(255,255,255,.04) 60%);
    border:1px solid var(--glass-brd); backdrop-filter:blur(20px); transition:background .4s ease;}
  body.theme-pro .profile-card{background:rgba(255,255,255,.03);}
  .avatar-big{width:72px; height:72px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--orange),var(--orange-2)); font-size:30px;}
  .profile-name{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600;}
  .profile-meta{color:var(--muted); font-size:13px; margin-top:3px;}
  .actions-row{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; padding:13px; border-radius:13px; border:none; font-size:13px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
  .btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange-2)); color:#0a0a0a;}
  .btn-ghost{background:var(--glass); border:1px solid var(--line); color:var(--text);}
  .form{display:flex; flex-direction:column; gap:10px; margin-top:18px; text-align:left;}
  .form label{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px; display:block;}
  .form input, .form select{width:100%; padding:11px 13px; border-radius:12px; background:rgba(255,255,255,.05);
    border:1px solid var(--line); color:var(--text); font-size:14px; font-family:'Inter',sans-serif;}
  .form input:disabled{opacity:.5;}
  .form-row{display:flex; gap:10px;}
  .form-row > div{flex:1;}
  .hint{font-size:11px; color:var(--muted); margin-top:2px;}
  .avatar-pick{display:flex; gap:8px; flex-wrap:wrap;}
  .avatar-opt{width:42px; height:42px; border-radius:50%; border:2px solid transparent; background:rgba(255,255,255,.06);
    display:flex; align-items:center; justify-content:center; font-size:19px; cursor:pointer;}
  .avatar-opt.active{border-color:var(--orange);}

  /* teachers / access */
  .form textarea{width:100%; padding:11px 13px; border-radius:12px; background:rgba(255,255,255,.05);
    border:1px solid var(--line); color:var(--text); font-size:13px; font-family:'Inter',sans-serif; min-height:74px; resize:vertical;}
  .form select option{background:#15151a; color:#f2efe9;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{border:1px solid var(--line); background:var(--glass); color:var(--text); border-radius:99px; padding:6px 11px;
    font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
  .chip.on{background:var(--orange); color:#0a0a0a; border-color:transparent;}
  .card.tcard{flex-wrap:wrap; align-items:flex-start;}
  .tsubj{font-size:12px; color:var(--muted); text-align:right; max-width:52%; line-height:1.4;}
  .tactions{flex-basis:100%; display:flex; gap:8px; justify-content:flex-end;}
  .tactions .btn{flex:0 0 auto; padding:7px 13px;}
  .err{font-size:12px; color:#ff8f8f; min-height:0;}
  .note{font-size:12px; color:var(--muted); margin:-6px 2px 14px; line-height:1.5;}
  body.transparent-bg .form textarea, body.transparent-bg .chip:not(.on){background:rgba(255,255,255,.06) !important; border-color:rgba(255,255,255,.16) !important;}

  footer{text-align:center; color:var(--muted); font-size:11px; margin-top:30px; line-height:1.6;}
  .view{display:none;} .view.active{display:block;}

  nav.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:5; padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
    background:rgba(10,10,12,.62); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
    border-top:1px solid var(--line); transition:background .4s ease;}
  body.theme-pro nav.tabbar{background:rgba(10,10,12,.28);}
  .tabbar-inner{max-width:640px; margin:0 auto; display:flex; justify-content:space-around;}
  .tab{background:none; border:none; color:var(--muted); font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 10px; cursor:pointer; border-radius:12px; transition:color .2s ease, transform .15s ease;}
  .tab .ic{font-size:20px; transition:transform .2s ease;}
  .tab.active{color:var(--orange-2);}
  .tab.active .ic{transform:translateY(-2px) scale(1.08);}
  @media (prefers-reduced-motion: reduce){.card,.hero,.tab,.tab .ic{transition:none;}}

  @media (min-width:860px){
    .wrap{max-width:760px; margin-left:104px; padding-bottom:40px;}
    nav.tabbar{left:0; right:auto; top:0; bottom:0; width:84px; height:100vh;
      border-top:none; border-right:1px solid var(--line); padding:28px 8px;}
    .tabbar-inner{flex-direction:column; justify-content:flex-start; gap:30px; height:100%;}
    .tab{flex-direction:column;}
  }

  /* faq */
  .faq details{border:1px solid var(--line); background:var(--glass); border-radius:14px; margin-bottom:8px; overflow:hidden;}
  .faq summary{list-style:none; cursor:pointer; padding:13px 15px; font-size:14px; font-weight:600; display:flex; justify-content:space-between; gap:10px; align-items:center;}
  .faq summary::-webkit-details-marker{display:none;}
  .faq summary::after{content:"+"; color:var(--orange-2); font-size:18px; line-height:1; flex-shrink:0;}
  .faq details[open] summary::after{content:"\2013";}
  .faq p{margin:0; padding:0 15px 14px; font-size:13px; line-height:1.55; color:var(--muted);}
  body.transparent-bg .faq details{background:rgba(255,255,255,.06) !important; border-color:rgba(255,255,255,.16) !important; backdrop-filter:blur(26px) saturate(180%) !important; -webkit-backdrop-filter:blur(26px) saturate(180%) !important;}

  /* ===== screen sizes (по заметкам) =====
     Телефоны: 320 mini | 360 обычные | 390 большие | 430 очень большие
     Планшеты: 600 | 768 | 834 | 1024
     ПК: 1280 | 1366 | 1920 | 2560 | 3840      ТВ: 1280x720 HD | 1920x1080 FHD | 3840x2160 4K | 7680x4320 8K */
  /* телефоны: время урока переносится под название, чтобы не налезало */
  @media (max-width:479px){
    .card:not(.tcard){flex-wrap:wrap; gap:3px 12px;}
    .card:not(.tcard) .lname{flex:1 1 auto;}
    .card:not(.tcard) .ltime{flex-basis:100%; text-align:left; white-space:normal;}
  }
  @media (max-width:359px){
    .wrap{padding:20px 12px 104px;}
    .brand{font-size:17px;}
    .hero{padding:18px 16px; border-radius:20px;}
    .hero-subject{font-size:22px;}
    .timer{font-size:32px;}
    .card{padding:12px 13px; gap:10px;}
    .lname{font-size:13px;}
    .ltime{font-size:11px;}
    .days button{padding:8px 11px; font-size:12px;}
    .tab{padding:4px 6px; font-size:10px;}
    .theme-grid{gap:8px;}
    .tsubj{max-width:46%;}
  }
  @media (min-width:430px) and (max-width:599px){
    .wrap{padding:30px 22px 112px;}
    .hero-subject{font-size:29px;}
  }
  @media (min-width:600px) and (max-width:859px){
    .wrap{max-width:680px; padding:36px 28px 124px;}
    .brand{font-size:22px;}
    .hero{padding:30px 28px; border-radius:28px;}
    .hero-subject{font-size:32px;}
    .timer{font-size:48px;}
    .card{padding:16px 20px;}
    .lname{font-size:15px;}
    .ltime{font-size:13px;}
    .days button{font-size:14px; padding:10px 16px;}
    .tab{font-size:11.5px; padding:4px 16px;}
    .theme-grid{grid-template-columns:repeat(4,1fr);}
  }
  @media (min-width:768px) and (max-width:859px){
    .wrap{max-width:720px;}
  }
  @media (min-width:1024px){
    .wrap{max-width:800px;}
    .hero-subject{font-size:30px;}
    .timer{font-size:44px;}
    .theme-grid{grid-template-columns:repeat(4,1fr);}
  }
  @media (min-width:1280px){
    .wrap{max-width:860px; margin-left:auto; margin-right:auto;}
  }
  @media (min-width:1280px) and (max-height:760px){
    .wrap{padding-top:18px;}
    .tabbar-inner{gap:16px;}
    nav.tabbar{padding:14px 8px;}
    .hero{padding:18px 22px; margin-bottom:14px;}
  }
  /* большие экраны и ТВ: масштабируем интерфейс целиком */
  @media (min-width:1920px){ .wrap, nav.tabbar{zoom:1.25;} nav.tabbar{height:auto;} }
  @media (min-width:2560px){ .wrap, nav.tabbar{zoom:1.6;} }
  @media (min-width:3840px){ .wrap, nav.tabbar{zoom:2.4;} }
  @media (min-width:7680px){ .wrap, nav.tabbar{zoom:4.8;} }

  /* focus list, teachers file, about */
  .card.dim{opacity:.58;}
  .card.tcard .lname{flex:1 1 0; min-width:0;}
  .card.tcard .tsubj{flex:0 1 50%; min-width:0; overflow-wrap:anywhere;}
  .card.now{background:linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08)), rgba(255,106,26,.10);}
  .tphone{font-size:12px; font-weight:500; margin-top:3px;}
  .tphone a{color:var(--orange-2); text-decoration:none;}
  .linkbtn{background:none; border:none; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; padding:12px 0; width:100%; text-align:center; font-family:'Inter',sans-serif;}
  .about-row{display:flex; justify-content:space-between; gap:12px; padding:12px 15px; border-radius:14px; background:var(--glass); border:1px solid var(--line); margin-bottom:8px; font-size:14px;}
  .about-row span:last-child{color:var(--muted); text-align:right;}
  .about-row a{color:var(--orange-2); text-decoration:none;}
  body.transparent-bg .about-row{background:rgba(255,255,255,.06) !important; border-color:rgba(255,255,255,.16) !important; backdrop-filter:blur(26px) saturate(180%) !important; -webkit-backdrop-filter:blur(26px) saturate(180%) !important;}

  /* roles / access */
  .role-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; text-align:left;}
  .role-card{display:flex; flex-direction:column; gap:4px; padding:16px 14px; border-radius:16px; border:1px solid var(--line); background:var(--glass); color:var(--text); cursor:pointer; font-family:'Inter',sans-serif; text-align:left;}
  .role-card:hover{border-color:var(--orange);}
  .role-card .ri{font-size:26px;}
  .role-card .rn{font-size:14px; font-weight:700;}
  .role-card .rd{font-size:11px; color:var(--muted); line-height:1.4;}
  .rolebadge{font-size:13px; font-weight:600; color:var(--orange-2); margin-bottom:14px; display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap;}
  .linkbtn.inline{width:auto; padding:0; display:inline; text-decoration:underline; color:var(--muted);}
  .codebox{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:22px; font-weight:700; letter-spacing:.12em; text-align:center; padding:14px; border-radius:14px; border:1px dashed var(--orange); color:var(--orange-2); margin:8px 0; user-select:all; word-break:break-all;}
  .mono-out{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;}
  .t-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 14px; border-radius:12px; background:var(--glass); border:1px solid var(--line); margin-bottom:8px; font-size:14px;}
  .t-row small{display:block; color:var(--muted); font-size:12px; margin-top:2px;}

function imageToAvatar(file){
  return new Promise((res, rej)=>{
    if(file.size > 60*1024*1024) return rej(new Error("big"));          // тип файла не проверяем: на Android он часто пустой
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      try{
        if(!img.naturalWidth || !img.naturalHeight) throw new Error("load");
        const N=192, c=document.createElement("canvas"); c.width=c.height=N;
        const ctx=c.getContext("2d"), m=Math.min(img.naturalWidth, img.naturalHeight);
        ctx.drawImage(img, (img.naturalWidth-m)/2, (img.naturalHeight-m)/2, m, m, 0, 0, N, N);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.85));
      }catch(e){ URL.revokeObjectURL(url); rej(new Error("load")); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("load")); };
    img.src = url;
  });
}

function hasSubtle(){ return typeof crypto!=="undefined" && !!crypto.subtle && typeof TextEncoder!=="undefined"; }
function hexToBytes(h){ return new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16))); }
function bytesToHex(b){ return Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join(""); }

async function pbkdf2Hex(pw, saltHex, iter){

  const bits=await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:hexToBytes(saltHex), iterations:iter}, key, 256);
  return bytesToHex(new Uint8Array(bits));

function gateStatus(key){

function gateFail(key){
  let o={n:0}; try{ o=JSON.parse(localStorage.getItem("sch_fail_"+key)||"{}"); }catch(e){}

  if(o.n>=5){ o.until=Date.now()+10*60000; o.n=0; }

/* телефон: только +992 (9 цифр) или +7 (10 цифр). "" — пусто, null — неверный */
function normPhone(raw){
  let s=String(raw==null?"":raw).trim(); if(!s) return "";
  let d=s.replace(/[^\d+]/g,"");
  if(d.startsWith("00")) d="+"+d.slice(2);
  if(!d.startsWith("+")){
    if(/^992\d{9}$/.test(d)) d="+"+d;
    else if(/^7\d{10}$/.test(d)) d="+"+d;
    else if(/^8\d{10}$/.test(d)) d="+7"+d.slice(1);
  }
  return (/^\+992\d{9}$/.test(d) || /^\+7\d{10}$/.test(d)) ? d : null;
}
function fmtPhone(p){
  if(/^\+992\d{9}$/.test(p)) return "+992 "+p.slice(4,7)+" "+p.slice(7,9)+" "+p.slice(9,11)+" "+p.slice(11,13);
  if(/^\+7\d{10}$/.test(p)) return "+7 "+p.slice(2,5)+" "+p.slice(5,8)+" "+p.slice(8,10)+" "+p.slice(10,12);
  return p;
}
function normTxt(s){ return String(s).toLowerCase().replace(/ё/g,"е").replace(/[^\p{L}\p{N}]+/gu," ").trim(); }

}

/* ---- файл со списком: ФИО - телефон - предметы - год рождения ---- */
function bornFromField(f){
  let m;
  if((m=f.match(/^(19[3-9]\d|20[01]\d)\s*(?:г\.?\s*р?\.?|y|йил)?$/i))) return normBorn(m[1]);
  if((m=f.match(/^\d{1,2}[./-]\d{1,2}[./-](19[3-9]\d|20[01]\d)$/))) return normBorn(m[1]);
  if((m=f.match(/^(\d{2})\s*(?:лет|года?|год|сол|y|yrs?|years?)$/i))){ const a=+m[1]; if(a>=20 && a<=85) return normBorn(new Date().getFullYear()-a); }
  return 0;
}
function parseTeachersText(text){
  text=String(text).replace(/^\uFEFF/,"");
  const t0=text.trim();
  if(t0[0]==="{" || t0[0]==="["){
    try{
      const o=JSON.parse(t0), arr=Array.isArray(o)?o:o.teachers;
      if(Array.isArray(arr)) return {items:arr.map(normTeacher).filter(x=>x.name), errors:[]};
    }catch(e){}
  }
  const HDR=["фио","ф и о","name","full name","ному насаб","фамилия имя отчество","фамилия"];
  const items=[], errors=[];
  text.split(/\r?\n/).forEach((raw,idx)=>{
    const line=raw.trim();
    if(!line || line[0]==="#") return;
    const sep = /[\t;|]/.test(line) ? /[\t;|]/ : /\s[-–—]\s/;
    let parts=line.split(sep).map(x=>x.trim()).filter(Boolean);
    if(!parts.length) return;
    if(parts.slice(0,2).some(x=>HDR.includes(normTxt(x)))) return;                 // строка-шапка
    if(parts.length>1 && /^\d{1,3}[.)]?$/.test(parts[0])) parts.shift();          // столбец «№»
    const name=parts[0].replace(/^\d{1,3}[.)]\s+/,"").trim();
    let phone="", subs=[], why=null, born=0;
    parts.slice(1).forEach(f=>{
      const by=bornFromField(f); if(by){ born=by; return; }
      const digits=(f.match(/\d/g)||[]).length;
      if(/^\+?[\d\s().\-]{6,}$/.test(f) && digits>=7){
        const p=normPhone(f);
        if(p===null) why=why||"phone"; else if(p && !phone) phone=p;
      } else {
        f.split(/[,،;/]+/).map(s=>s.trim()).filter(Boolean).forEach(s=>subs.push(s));
      }
    });
    if(!/\p{L}/u.test(name) || name.length<2) why=why||"name";
    if(!why && !phone) why="nophone";
    if(!why && !subs.length) why="subj";
    if(why){ errors.push({n:idx+1, why}); return; }
    const keys=[]; subs.forEach(s=>{ const k=subjKey(s)||s; if(!keys.includes(k)) keys.push(k); });
    items.push({name, phone, subjects:keys, born});
  });
  return {items, errors};
}

    if(n.includes("word/document.xml")) return {text:docxToText(utf8(await zip.read("word/document.xml")))};
    if(n.includes("xl/workbook.xml")) return {text:await xlsxToText(zip)};
    if(n.includes("content.xml")) return {text:odfToText(utf8(await zip.read("content.xml")))};
    return {note:"impUnsupported_zip"};
  }
  if(sig(0x25,0x50,0x44,0x46)) return {note:"impUnsupported_pdf"};
  if(sig(0xD0,0xCF,0x11,0xE0)) return {note:"impUnsupported_ole"};
  let text=decodeBuffer(buf); const head=text.slice(0,300).trim();
  if(/^\{\\rtf/i.test(head)) text=rtfToText(text);
  else if(/^<(!doctype|html|table|\?xml|body)/i.test(head)) text=htmlToText(text);
  return {text};
}
